<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">

        </div> 

        <div class="card"> 
            <div class="card-title">Sales Manager</div> 
            <div class="card-company">SalesPro Inc.</div> 
            <button class="btn" onclick="viewDetails('Sales Manager')">See more</button> 
        </div> 

        <div class="card"> 
            <div class="card-title">Accountant</div> 
            <div class="card-company">Finance Solutions</div> 
            <button class="btn" onclick="viewDetails('Accountant')">See more</button>

    </div>
